f-knowledge-ai-context.md"},{"slug":"data-leakage-ai-systems","term":"Data Leakage (AI Systems)","category":"Observability & Governance","essence":"When sensitive information from training data unintentionally surfaces in model outputs — exposing content that was never meant to be accessible.","short":"When sensitive information from training data or context surfaces in model outputs — exposing what was never meant to be accessible","aliases":["memorization","training data extraction","it leaked our data","PII in output","data exposure"],"tags":["Security","Privacy"],"version":"v1.0","updated":"August 2026","related":["audit-trail-ai","data-minimization","knowledge-base","memory-ai-systems","permission-model-ai","privacy-ai-systems","prompt-injection","red-teaming"],"sources":["SRC-039","SRC-060","SRC-148","SRC-150","SRC-161"],"path":"concepts/data-leakage-ai-systems.md"},{"slug":"data-minimization","term":"Data Minimization","category":"Observability & Governance","essence":"Only giving the AI the data it actually needs — nothing extra. Less data means less risk of privacy problems, lower cost, and a more focused system.","short":"Collecting and keeping only the data a system actually needs — less data, less risk, lower cost","aliases":["collect only what you need","least data","GDPR minimization","data reduction","need to know"],"tags":["Privacy","Regulatory","Data Governance"],"version":"v1.0","updated":"June 2026","related":["ai-governance","bias-ai-systems","compliance-ai-systems","data-quality","grounding","human-responsibility-in-ai-use"],"sources":["SRC-126","SRC-127","SRC-129"],"path":"concepts/data-minimization.md"},{"slug":"data-provenance-lineage","term":"Data Provenance / Lineage","category":"Knowledge & Memory","essence":"The traceable history of where data came from, how it was transformed, and what it has touched — the record that makes it possible to answer \"can we actually use this?\" for training or retrieval data.","short":"Where the data came from and what has happened to it since — the record that answers \"can we actually use this?\"","aliases":["data lineage","provenance","dataset provenance","data origin","where did this data come from"],"tags":["Data Governance","Regulatory"],"version":"v1.1","updated":"August 2026","related":["audit-trail-ai","bias-ai-systems","compliance-ai-systems","copyright-ai-output","data-leakage-ai-systems","data-minimization","data-quality","knowledge-base","model-card-system-card","model-data-drift","ownership-ai-systems","privacy-ai-systems","rag","training-data"],"sources":["SRC-001","SRC-025","SRC-039","SRC-197","SRC-198","SRC-199"],"path":"concepts/data-provenance-lineage.md"},{"slug":"data-quality","term":"Data Quality","category":"Knowledge & Memory","essence":"The fitness of data for its intended use — and the upstream constraint that determines the reliability of every AI system built on it.","short":"The fitness of data for its intended use — and the upstream constraint on every AI system built on it","aliases":["fitness for purpose","garbage in garbage out","data readiness","clean data","data fitness"],"tags":["Data Governance"],"version":"v1.0","updated":"May 2026","related":["context-engineering","hallucination","harness-paradigm","model-data-drift","observability","persistent-synthesis","rag"],"sources":["SRC-025","SRC-051","SRC-052"],"path":"concepts/data-quality.md"},{"slug":"deception-ai-systems","term":"Deception (AI Systems)","category":"Reliability & Quality","essence":"When a model conveys something it does not internally represent as true — asserting, implying or omitting to produce a false impression, as distinct from being confidently wrong.","short":"Output that systematically induces false beliefs because something other than truth was being optimized for","aliases":["misleading output","AI deception","did it lie to me","systematic misleading","manipulation"],"tags":["Safety","Model Behavior","Ethics"],"version":"v1.1","updated":"August 2026","relat sional space arranged so that related meanings land near each other — the layer that makes semantic retrieval possible, and that encodes whatever associations its training data contained as measurable direction.","short":"Turning text into coordinates so that similar meanings sit close together — the representation that makes semantic search work, and that carries the training data's biases as geometry","aliases":["vector embeddings","word embeddings","sentence embeddings","vectors","vector search","semantic search","word2vec","vector database","latent space"],"tags":["Architecture","AI Literacy"],"version":"v1.0","updated":"September 2026","related":["bias-ai-systems","data-leakage-ai-systems","data-provenance-lineage","grounding","knowledge-base","memory-ai-systems","model-version-update","multimodal-ai","pre-training","privacy-ai-systems","rag","tokenization"],"sources":["SRC-020","SRC-141","SRC-224","SRC-225","SRC-226","SRC-227"],"path":"concepts/embeddings.md"},{"slug":"evaluation","term":"Evaluation (AI Systems)","category":"Reliability & Quality","essence":"The structured practice of measuring whether an AI system does what it is supposed to do — before deployment and continuously in production.","short":"The structured practice of measuring whether an AI system does what it is supposed to do — before deployment and continuously in production","aliases":["evals","benchmarking","how do we know it works","testing AI","measuring performance"],"tags":["Evaluation","Data Governance"],"version":"v1.1","updated":"August 2026","related":["hallucination","human-in-the-loop","observability","persistent-synthesis","rag","red-teaming"],"sources":["SRC-065","SRC-131","SRC-132","SRC-179"],"path":"concepts/evaluation.md"},{"slug":"explainability-xai","term":"Explainability (XAI)","category":"Foundations","essence":"The ability to describe, in terms a human can understand, why an AI system produced a specific output — a prerequisite for accountability in high-stakes decisions.","short":"Describing, in terms a human can understand, why an AI system produced a specific output — a prerequisite for accountability","aliases":["XAI","interpretability","why did it decide that","explainable AI","right to explanation"],"tags":["Ethics","Regulatory","Evaluation"],"version":"v1.0","updated":"June 2026","related":["accountability-ai-systems","ai-governance","black-box","confidence-vs-accuracy","hallucination","human-responsibility-in-ai-use","observability"],"sources":["SRC-024","SRC-123","SRC-124","SRC-125"],"path":"concepts/explainability-xai.md"},{"slug":"failure-modes-ai-systems","term":"Failure Modes (AI Systems)","category":"Reliability & Quality","essence":"The specific ways an AI system can go wrong — from hallucination to scope creep to misuse — each requiring different governance responses.","short":"The specific ways an AI system can go wrong — each requiring a different detection-and-response control","aliases":["what can go wrong","AI failures","error modes","risk taxonomy","ways AI breaks"],"tags":["Evaluation","Safety"],"version":"v1.0","updated":"June 2026","related":["ai-agent","ai-governance","bias-ai-systems","black-box","evaluation","grounding","hallucination","human-in-the-loop"],"sources":["SRC-001","SRC-045","SRC-128"],"path":"concepts/failure-modes-ai-systems.md"},{"slug":"fine-tuning","term":"Fine-tuning","category":"Foundations","essence":"Adapting a pre-trained model to a specific domain or task by training it further on targeted data — between prompting and building from scratch in cost, control, and risk.","short":"Adapting a model on your own data — cheap enough to be routine, and it can silently strip the safety behavior you were relying on","aliases":["LoRA","PEFT","parameter-efficient fine-tuning","adapting a model","custom model","training on our own data","domain adaptation"],"tags":["Architecture","Data Governance","Security"],"version":"v1.0","updated":"September 2026","related":["data-provenance-lineage","evaluation","guardrails-ai-systems","local-llms","model-card-system-card","model-version-update","ownership-ai-systems","privacy-ai-systems","rag","rlhf","shadow-ai","small-language-models","training-data"],"sources":["SRC-142","SRC-150","SRC-197","SRC-198","SRC-215","SRC-216"],"path":"concepts/fine-tuning.md"},{"slug":"frontier-ai","term":"Frontier AI (Frontier Model)","category":"Observability & Governance","essence":"The most capable AI models at any given time — the class regulators and AI labs single out for extra safety scrutiny because their capabilities are advancing faster than tools to evaluate them.","short":"The leading edge — a category defined by capabilities being discovered after training, not by size","aliases":["frontier model","state of the art model","most capable models","cutting edge AI","leading models"],"tags":["Regulatory","Safety"],"version":"v1.0","updated":"August 2026","related":["ai-governance","ai-incident-reporting","alignment-ai-systems","compliance-ai-systems","evaluation","model-card-system-card","model-data-drift","power-seeking","reasoning-models","red-teaming","scalable-oversight","small-language-models","systemic-risk-ai"],"sources":["SRC-001","SRC-115","SRC-143","SRC-159","SRC-200","SRC-203"],"path":"concepts/frontier-ai.md"},{"slug":"fundamental-rights-impact-assessment","term":"Fundamental Rights Impact Assessment (FRIA)","category":"Observability & Governance","essence":"A required pre-deployment analysis of how a high-risk AI system could affect people's fundamental rights — fairness, privacy, non-discrimination — before it goes live, not after.","short":"A deployer's pre-launch assessment of who is affected and what recourse they have — and it binds far fewer organizations than commonly claimed","aliases":["FRIA","rights impact assessment","Article 27","impact assessment","pre-deployment assessment"],"tags":["Regulatory","Ethics"],"version":"v1.0","updated":"August 2026","related":["accountability-ai-systems","agency-ai-systems","ai-governance","ai-use-case","bias-ai-systems","compliance-ai-systems","human-in-the-loop","human-responsibility-in-ai-use","model-card-system-card","operational-readiness-ai","privacy-ai-systems","systemic-risk-ai"],"sources":["SRC-001","SRC-039","SRC-109","SRC-121","SRC-129","SRC-211"],"path":"concepts/fundamental-rights-impact-assessment.md"},{"slug":"grounding","term":"Grounding","category":"Knowledge & Memory","essence":"Anchoring model outputs to specific, verifiable sources — reducing hallucination by giving the model something real to reason from.","short":"Anchoring model outputs to specific, verifiable sources — reducing hallucination by giving the model something real to reason from","aliases":["source anchoring","citations","factual grounding","evidence-backed output","tie answers to sources"],"tags":["Data Governance","Evaluation"],"version":"v1.0","updated":"May 2026","related":["context-engineering","hallucination","harness-paradigm","observability","persistent-synthesis","rag"],"sources":["SRC-020","SRC-028","SRC-066"],"path":"concepts/grounding.md"},{"slug":"guardrails-ai-systems","term":"Guardrails (AI Systems)","category":"System Architecture","essence":"Technical and policy constraints that prevent an AI system from producing outputs or taking actions outside defined boundaries.","short":"Technical and policy constraints that prevent an AI system from producing outputs or taking actions outside defined boundaries","aliases":["safety filters","content filtering","constraints","boundaries","policy enforcement"],"tags":["Security","Architecture","Safety"],"version":"v1.0","updated":"July 2026","related":["audit-trail-ai","compliance-ai-systems","failure-modes-ai-systems","harness-paradigm","human-in-the-loop"],"sources":["SRC-001","SRC-032","SRC-085","SRC-129","SRC-135"],"path":"concepts/guardrails-ai-systems.md"},{"slug":"hallucination","term":"Hallucination","category":"Foundations","essence":"AI models generate plausible-sounding content that is factually incorrect — confidently and without warning.","short":"AI models generate plausible-sounding content that is factually incorrect — confidently and without warning","aliases":["confabulation","making things up","fabricated facts","invented citations","false output"],"tags":["Model Behavior","Evaluation"],"version":"v1.2","updated":"May 2026","related":["grounding","harness-paradigm","human-in-the-loop","persistent-synthesis","rag","verification"],"sources":["SRC-010","SRC-023","SRC-051","SRC-064"],"path":"concepts/hallucination.md"},{"slug":"harness-paradigm","term":"Harness Paradigm","category":"System Architecture","essence":"Intelligence and control are separate layers — governance lives in the harness, not the model.","short":"Intelligence and control are separate layers — governance lives in the harness","aliases":["agent harness","scaffolding","the layer around the model","control layer","harness engineering"],"tags":["Architecture","Agents"],"version":"v1.3","updated":"July 2026","related":["ai-agent","context-engineering","failure-modes-ai-systems","guardrails-ai-systems","hallucination","human-in-the-loop","memory-ai-systems","permission-model-ai","system-prompt"],"sources":["SRC-018","SRC-019","SRC-071","SRC-103","SRC-118"],"path":"concepts/harness-paradigm.md"},{"slug":"human-responsibility-in-ai-use","term":"Human Responsibility in AI Use","category":"Human Oversight","essence":"The obligation to oversee AI decisions and be answerable for their outcomes does not transfer to the system — it remains with the humans who deploy, configure, and use it.","short":"The obligation to oversee AI decisions does not transfer to the system — it remains with the humans who deploy and use it","aliases":["responsibility gap","who is to blame","the AI did it","moral responsibility","accountability does not transfer"],"tags":["Ethics","AI Literacy"],"version":"v1.1","updated":"June 2026","related":["accountability-ai-systems","ai-governance","compliance-ai-systems","human-in-the-loop","ownership-ai-systems"],"sources":["SRC-001","SRC-106","SRC-107","SRC-113","SRC-119","SRC-120"],"path":"concepts/human-responsibility-in-ai-use.md"},{"slug":"human-in-the-loop","term":"Human-in-the-Loop (HITL)","category":"Human Oversight","essence":"A design pattern that keeps humans as decision authorities at critical points — not as a safety afterthought, but as a structural component of the system.","short":"A design pattern that keeps humans as decision authorities at critical points","aliases":["HITL","human review","human oversight","approval step","human in the loop"],"tags":["Ethics","Agents"],"version":"v1.1","updated":"May 2026","related":["context-engineering","evaluation","guardrails-ai-systems","hallucination","harness-paradigm","human-responsibility-in-ai-use"],"sources":["SRC-015","SRC-016","SRC-017","SRC-034"],"path":"concepts/human-in-the-loop.md"},{"slug":"human-ai-collaboration-model","term":"Human–AI Collaboration Model","category":"Human Oversight","essence":"The explicit design of how humans and AI systems divide tasks, share information, and maintain oversight — not assumed, but documented and enforced.","short":"The explicit design of how people and AI systems divide work, hand over, and resolve disagreement — documented, not assumed","aliases":["division of labor with AI","who does what","handoff design","human AI teaming","collaboration pattern"],"tags":["Architecture","Ethics"],"version":"v1.0","updated":"August 2026","related":["accountability-ai-systems","ai-literacy","evaluation","explainability-xai","human-in-the-loop","human-responsibility-in-ai-use","ownership-ai-systems","permission-model-ai","raci","sycophancy-llms"],"sources":["SRC-015","SRC-016","SRC-017","SRC-109","SRC-168"],"path":"concepts/human-ai-collaboration-model.md"},{"slug":"human-llm-communication-skills","term":"Human–LLM Communication Skills","category":"Interaction & Design","essence":"The ability to communicate effectively with language models — structuring inputs, recognizing output limitations, and knowing when not to trust the result.","short":"Working well with a model is mostly noticing what you left unstated — and knowing when not to trust the answer","aliases":["talking to AI","how to work with AI","AI communication","getting better answers","working with a model"],"tags":["AI Literacy","Prompting"],"version":"v1.0","updated":"August 2026","related":["ai-literacy","anthropomorphism-ai","automation-bias","cognitive-offloading-deskilling","concealing-uncertainty","confidence-vs-accuracy","context-ai-systems","curse-of-knowledge-ai-context","human-ai-collaboration-model","human-responsibility-in-ai-use","prompt-engineering","sycophancy-llms","verification"],"sources":["SRC-013","SRC-041","SRC-067","SRC-068","SRC-172","SRC-190"],"path":"concepts/human-llm-communication-skills.md"},{"slug":"jailbreak","term":"Jailbreak","category":"System Architecture","essence":"Bypassing an AI model's safety training through crafted prompts, rather than exploiting a technical flaw — getting the model to do what it was trained to refuse, from the inside.","short":"Bypassing a model's safety training through crafted prompts rather than a technical flaw — getting it to do what it was trained to refuse","aliases":["prompt jailbreaking","bypassing safety","getting it to break its rules","safety bypass","DAN"],"tags":["Security","Safety"],"version":"v1.0","updated":"August 2026","related":["alignment-ai-systems","failure-modes-ai-systems","guardrails-ai-systems","permission-model-ai","prompt-injection","red-teaming","system-prompt","tool-use"],"sources":["SRC-060","SRC-148","SRC-157"],"path":"concepts/jailbreak.md"},{"slug":"knowledge-base","term":"Knowledge Base","category":"Knowledge & Memory","essence":"The collection of documents and information an AI can look up when answering questions — like a reference library it can search. The quality and governance of the library directly determines the quality and trustworthiness of the answers.","short":"The collection of documents an AI can look up when answering — the quality of the library determines the quality of the answers","aliases":["document corpus","reference library","the documents it searches","KB","knowledge repository"],"tags":["Architecture","Data Governance"],"version":"v1.0","updated":"July 2026","related":["data-quality","domain","grounding","memory-ai-systems","rag"],"sources":["SRC-020","SRC-025","SRC-052","SRC-138"],"path":"concepts/knowledge-base.md"},{"slug":"knowledge-cutoff","term":"Knowledge Cutoff","category":"Foundations","essence":"Every model was trained up to a fixed point in time and knows nothing after it — which is why it can be confidently wrong about recent events, and why it may not know it is out of date.","short":"Every model was trained up to a fixed date and knows nothing after it — and cannot reliably tell you when a question falls outside what it knows","aliases":["training cutoff","why doesn't it know about recent events","out of date model","cutoff date","stale knowledge"],"tags":["Model Behavior","AI Literacy"],"version":"v1.0","updated":"August 2026","related":["concealing-uncertainty","confidence-vs-accuracy","grounding","hallucination","knowledge-base","large-language-models","model-data-drift","model-version-update","rag"],"sources":["SRC-010","SRC-028","SRC-142","SRC-177"],"path":"concepts/knowledge-cutoff.md"},{"slug":"large-language-models","term":"Large Language Models (LLMs)","category":"Foundations","essence":"Neural networks trained on vast text corpora that generate language by predicting what comes next — the foundation of most modern AI assistants, tools, and agents.","short":"Neural networks trained on vast text corpora that generate language by predicting what comes next — the foundation of most modern AI tools and agents","aliases":["LLM","foundation model","language model","GPT","chatbot model"],"tags":["Architecture"],"version":"v1.0","updated":"July 2026","related":["ai-agent","determinism-vs-probabilism","fine-tuning","grounding","hallucination","harness-paradigm","rag","types-of-ai-systems"],"sources":["SRC-007","SRC-141","SRC-142","SRC-143"],"path":"concepts/large-language-models.md"},{"slug":"local-llms","term":"Local LLMs","category":"Foundations","essence":"Language models run entirely on your own infrastructure — no data leaves your environment, but full governance responsibility falls on the organization with no vendor backstop.","short":"Models run on your own infrastructure — the data stays in, and every duty the provider was carrying becomes yours","aliases":["on-premises AI","self-hosted LLM","offline model","open weights deployment","run AI on my own servers"],"tags":["Architecture","Privacy","Security"],"version":"v1.0","updated":"August 2026","related":["compliance-ai-systems","data-leakage-ai-systems","data-minimization","data-provenance-lineage","guardrails-ai-systems","model-data-drift","operational-readiness-ai","ownership-ai-systems","privacy-ai-systems","scalability-ai-systems","shadow-ai","small-language-models"],"sources":["SRC-039","SRC-087","SRC-098","SRC-100","SRC-101","SRC-102"],"path":"concepts/local-llms.md"},{"slug":"memory-ai-systems","term":"Memory (AI Systems)","category":"Knowledge & Memory","essence":"How an AI remembers things — what it keeps during a conversation, what carries over to future sessions, and what it can reuse as a learned skill.","short":"How an AI remembers — what it keeps in a conversation, what carries over to future sessions, and what it reuses as learned skill","aliases":["does it remember me","conversation history","persistence","session memory","long-term memory"],"tags":["Architecture","Privacy"],"version":"v1.0","updated":"July 2026","related":["audit-trail-ai","context-engineering","knowledge-base","persistent-synthesis","rag"],"sources":["SRC-050","SRC-064","SRC-079","SRC-137"],"path":"concepts/memory-ai-systems.md"},{"slug":"model-card-system-card","term":"Model Card / System Card","category":"Observability & Governance","essence":"A standardized document describing a model's capabilities, limitations, training data, and evaluation results — the transparency artifact regulators and users increasingly expect before trusting a system.","short":"The transparency artifact — a scoping document whose job is to say where *not* to use a model","aliases":["model card","system card","model documentation","what does this model do","transparency artifact"],"tags":["Regulatory","Evaluation","Data Governance"],"version":"v1.0","updated":"August 2026","related":["accountability-ai-systems","ai-disclosure-attribution","ai-use-case","bias-ai-systems","compliance-ai-systems","data-provenance-lineage","evaluation","explainability-xai","frontier-ai","guardrails-ai-systems","model-data-drift","operational-readiness-ai","training-data"],"sources":["SRC-001","SRC-065","SRC-121","SRC-129","SRC-199","SRC-201"],"path":"concepts/model-card-system-card.md"},{"slug":"model-version-update","term":"Model Version & Update","category":"Reliability & Quality","essence":"The system you use today may not be the system you tested — providers change models underneath you, and behavior that was reliable can shift without notice.","short":"The system you use today may not be the one you tested — providers change models underneath you, and reliable behavior can shift without notice","aliases":["model updates","version pinning","deprecation","it changed without telling us","model changed","provider update","snapshot models"],"tags":["Model Behavior","Evaluation","Regulatory"],"version":"v1.0","updated":"September 2026","related":["ai-incident-reporting","compliance-ai-systems","evaluation","fine-tuning","frontier-ai","local-llms","model-card-system-card","model-data-drift","observability","operational-readiness-ai","prompt-engineering","rlhf"],"sources":["SRC-001","SRC-129","SRC-165","SRC-166","SRC-196","SRC-217"],"path":"concepts/model-version-update.md"},{"slug":"model-data-drift","term":"Model/Data Drift","category":"Reliability & Quality","essence":"The gradual degradation in an AI system's reliability as the real world changes and its training data or assumptions become outdated.","short":"The quiet decay of a deployed system as the world moves away from its training data — nothing breaks, accuracy just slides","aliases":["concept drift","model decay","it used to work","performance degradation","data drift"],"tags":["Model Behavior","Data Governance","Evaluation"],"version":"v1.0","updated":"August 2026","related":["confidence-vs-accuracy","continuous-feedback-improvement","data-quality","evaluation","failure-modes-ai-systems","knowledge-base","observability","operational-readiness-ai","rag"],"sources":["SRC-001","SRC-028","SRC-165","SRC-166"],"path":"concepts/model-data-drift.md"},{"slug":"moral-crumple-zone","term":"Moral Crumple Zone","category":"Human Oversight","essence":"The human operator who ends up bearing moral and legal responsibility for the failure of a complex automated system they could not realistically have controlled — absorbing the impact to protect the system, exactly as a car's crumple zone absorbs a crash to protect what is behind it.","short":"The human operator who absorbs blame when an automated system fails — protecting the system's integrity at the nearest person's expense, exactly as a car's crumple zone absorbs a crash","aliases":["custodial agency","moral crumple zones","blame the operator","human in the loop takes the blame","responsibility without control","liability sink","scapegoat","who gets blamed when AI fails","embedded oversight"],"tags":["Ethics","AI Literacy"],"version":"v1.0","updated":"September 2026","related":["accountability-ai-systems","agency-ai-systems","ai-incident-reporting","automation-bias","bluewashing","continuous-feedback-improvement","human-ai-collaboration-model","human-in-the-loop","human-responsibility-in-ai-use","ownership-ai-systems","raci","scalable-oversight" l metric it was given rather than the actual intended goal — technically succeeding while completely missing the point.","short":"The system satisfies the metric and defeats the point — and more capable models do it more, not less","aliases":["specification gaming","Goodhart's law","gaming the metric","optimizing the wrong thing","reward misspecification"],"tags":["Safety","Evaluation","Model Behavior"],"version":"v1.0","updated":"August 2026","related":["ai-agent","alignment-ai-systems","deception-ai-systems","evaluation","failure-modes-ai-systems","guardrails-ai-systems","human-in-the-loop","model-version-update","observability","permission-model-ai","power-seeking","sycophancy-llms"],"sources":["SRC-179","SRC-180","SRC-181","SRC-182","SRC-183","SRC-184"],"path":"concepts/reward-hacking.md"},{"slug":"rlhf","term":"RLHF (Reinforcement Learning from Human Feedback)","category":"Foundations","essence":"A training technique that shapes model behavior using human ratings of its outputs as a reward signal — the foundational method behind aligning raw language models with what people actually want.","short":"Humans rank outputs, the model learns the ranking — the step that turns a raw model into an assistant, and imports whoever did the ranking","aliases":["reinforcement learning from human feedback","preference optimization","human feedback training","RLAIF","DPO","how models are made polite"],"tags":["Model Behavior","Ethics","Evaluation"],"version":"v1.0","updated":"September 2026","related":["alignment-ai-systems","bias-ai-systems","concealing-uncertainty","evaluation","fine-tuning","human-in-the-loop","large-language-models","model-version-update","reward-hacking","scalable-oversight","sycophancy-llms","training-data"],"sources":["SRC-142","SRC-167","SRC-172","SRC-193","SRC-196","SRC-214"],"path":"concepts/rlhf.md"},{"slug":"scalability-ai-systems","term":"Scalability (AI Systems)","category":"Organizational Readiness","essence":"An AI system's ability to handle inc "v1.0","updated":"September 2026","related":["bias-ai-systems","context-window","embeddings","hallucination","large-language-models","local-llms","model-version-update","multimodal-ai","pre-training","scalability-ai-systems"],"sources":["SRC-141","SRC-142","SRC-221","SRC-222"],"path":"concepts/tokenization.md"},{"slug":"tool-use","term":"Tool Use","category":"System Architecture","essence":"How an AI model acts on the world rather than just describing it — calling external functions, APIs, and data sources, and folding the results back into its reasoning.","short":"How an AI model acts on the world rather than just describing it — calling external functions, APIs, and data sources","aliases":["function calling","tool calling","API calls from AI","actions","MCP tools"],"tags":["Agents","Architecture","Security"],"version":"v1.0","updated":"August 2026","related":["ai-agent","audit-trail-ai","grounding","guardrails-ai-systems","harness-paradigm","human-in-the-loop","multi-agent-systems","permission-model-ai","prompt-injection"],"sources":["SRC-021","SRC-022","SRC-103","SRC-104","SRC-154"],"path":"concepts/tool-use.md"},{"slug":"training-data","term":"Training Data","category":"Knowledge & Memory","essence":"The text, images and code a model learned from — where its knowledge, its gaps, its blind spots and its biases all come from, and which is rarely fully disclosed.","short":"What the model learned from — where its knowledge, gaps, blind spots and biases all come from, and which is rarely disclosed","aliases":["what was it trained on","training corpus","pretraining data","the data behind the model","where its knowledge comes from"],"tags":["Data Governance","Ethics","AI Literacy"],"version":"v1.0","updated":"August 2026","related":["bias-ai-systems","copyright-ai-output","data-leakage-ai-systems","data-provenance-lineage","data-quality","evaluation","hallucination","knowledge-cutoff","large-language-models","local-llms","model-card-system-card","pre-training","privac ground truth before trusting it — run the code, check the source, test the claim — because plausible is not the same as correct.","short":"Checking this output against ground truth before trusting it — and the finding that people check least on the problems that most need it","aliases":["fact checking AI output","checking the answer","should I trust this","validating output","double checking"],"tags":["Evaluation","AI Literacy"],"version":"v1.0","updated":"August 2026","related":["audit-trail-ai","automation-bias","cognitive-offloading-deskilling","concealing-uncertainty","confidence-vs-accuracy","evaluation","explainability-xai","grounding","hallucination","human-in-the-loop","human-responsibility-in-ai-use"],"sources":["SRC-001","SRC-174","SRC-189","SRC-190","SRC-191"],"path":"concepts/verification.md"}]};
// Results link to the canonical rendered view. Relative .md links break in both
// deployment contexts: Jekyll rewrites them to .html on Pages, and a browser opening
// file:// shows raw markdown. The blob URL renders correctly from either.
const BLOB = "https://github.com/luispsalas/applied-ai-concepts/blob/main/";

const STOP = new Set(("a an the and or of for to in on is are was were be been it its this that "+
  "with when what who whom whose how why do does did can could should would i you my our we "+
  "if not no as at by from about into over than then there here").split(" "));
const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();

// Light suffix stripping so "responsible" reaches "responsibility", "agents" reaches
// "agent", "governing" reaches "governance". Not a real stemmer — a real one would
// need a dependency, and this corpus is 81 short strings.
const SUF = ["ibility","ability","ization","isation","ivity","ility","ement","ments","ances",
             "ences","ation","ition","ingly","ness","ible","able","ance","ence","ment","tion",
             "sion","ing","ies","ers","est","ed","es","ly","s"];
function stem(w){
  if (w.length < 5) return w;
  for (const suf of SUF){
    if (w.length - suf.length >= 4 && w.endsWith(suf)) return w.slice(0, w.length - suf.length);
  }
  return w;
}
const toks = s => norm(s).split(" ").filter(t => t && !STOP.has(t)).map(stem);

// Precompute the searchable surface once.
for (const e of DATA.entries){
  e._term = norm(e.term);
  e._alias = (e.aliases||[]).map(norm);
  e._words = {
    term: new Set(toks(e.term)),
    alias: new Set(e._alias.flatMap(a => toks(a))),
    tag: new Set((e.tags||[]).flatMap(t => toks(t))),
    tag1: new Set(toks((e.tags||[])[0] || "")),   // first tag = primary topic, authored that way
    text: new Set([...toks(e.short||""), ...toks(e.essence||"")]),
    cat: new Set(toks(e.category||""))
  };
  e._all = new Set([...e._words.term, ...e._words.alias, ...e._words.tag, ...e._words.text]);
}

// Inverse document frequency. Without this, "ai" — a token in nearly every term in
// an AI glossary — outweighs the one word in the query that actually discriminates.
// A token matching most of the corpus tells you nothing, and should score like it.
const N = DATA.entries.length, DF = new Map();
for (const e of DATA.entries) for (const w of e._all) DF.set(w, (DF.get(w)||0) + 1);
const idf = t => Math.max(0.04, Math.log(N / (1 + (DF.get(t)||0))) / Math.log(N));

const anyHit = (set, t) => set.has(t) || (t.length >= 4 && [...set].some(w => w.startsWith(t)));

function score(e, raw, tk){
  let s = 0, why = null;
  if (raw){
    if (e._term === raw) return {s: 1000, why: null};
    const ai = e._alias.indexOf(raw);
    if (ai > -1) return {s: 900, why: e.aliases[ai]};
    if (e._term.startsWith(raw)) s += 500;
    else if (e._term.includes(raw)) s += 300;
    const ap = e._alias.findIndex(a => a.includes(raw));
    if (ap > -1){ s += 250; why = e.aliases[ap]; }
  }
  let hits = 0, wsum = 0, whit = 0;
  for (const t of tk){
    const w = idf(t); wsum += w;
    let h = 0;
    if (anyHit(e._words.term, t))  h = 60;
    else if (anyHit(e._words.alias, t)) h = 40;
    // Tags are ordered by primacy when authored, so a hit on the FIRST tag means the
    // entry is *about* that topic rather than merely touching it. Without this every
    // tag match ties and results fall back to alphabetical — "security" led with
    // Agency and Audit Trail instead of Prompt Injection and Jailbreak.
    else if (anyHit(e._words.tag1, t))  h = 32;
    else if (anyHit(e._words.tag, t))   h = 20;   // topical signal, not a name — must not
    else if (anyHit(e._words.text, t))  h = 12;   // outrank an entry actually titled this
    else if (anyHit(e._words.cat, t))   h = 5;
    if (h){ s += h * w; hits++; whit += w; }
  }
  if (!s) return null;
  // Reward covering the INFORMATIVE part of the query, weighted by idf rather than
  // by token count — otherwise matching "ai" twice beats matching "responsible" once.
  if (tk.length > 1 && wsum) s += (whit / wsum) * 60;
  if (!why && tk.length){
    const m = (e.aliases||[]).find(a => tk.some(t => anyHit(new Set(toks(a)), t)));
    if (m) why = m;
    else {
      const g = (e.tags||[]).find(t2 => tk.some(t => anyHit(new Set(toks(t2)), t)));
      if (g) why = `tag: ${g}`;
    }
  }
  return {s, why};
}

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(text, tk){
  let out = esc(text);
  for (const t of [...new Set(tk)].sort((a,b)=>b.length-a.length)){
    if (t.length < 3) continue;
    out = out.replace(new RegExp(`(?<![\\\\w>])(${t.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&")}\\\\w*)`,"gi"),
                      "<mark>$1</mark>");
  }
  return out;
}

let filter = null, tagf = null, sel = -1, rows = [];
const $q = document.getElementById("q"), $out = document.getElementById("out"),
      $n = document.getElementById("n"), $cats = document.getElementById("cats"),
      $tags = document.getElementById("tags");

const TAGV = ["AI Literacy", "Agents", "Architecture", "Data Governance", "Ethics", "Evaluation", "Model Behavior", "Privacy", "Prompting", "Regulatory", "Safety", "Security"];
$tags.innerHTML = `<span class="lbl">topic</span>` + TAGV.map(t =>
  `<button class="cat tag" aria-pressed="false" data-t="${esc(t)}">${esc(t)}</button>`).join("");
$tags.onclick = ev => {
  const b = ev.target.closest(".cat"); if (!b) return;
  tagf = tagf === b.dataset.t ? null : b.dataset.t;
  [...$tags.querySelectorAll(".cat")].forEach(x => x.setAttribute("aria-pressed", x.dataset.t === tagf));
  run();
};

const CATS = [...new Set(DATA.entries.map(e => e.category))].sort();
$cats.innerHTML = `<span class="lbl">section</span>` + CATS.map(c =>
  `<button class="cat" aria-pressed="false" data-c="${esc(c)}">${esc(c)}</button>`).join("");
$cats.onclick = ev => {
  const b = ev.target.closest(".cat"); if (!b) return;
  filter = filter === b.dataset.c ? null : b.dataset.c;
  [...$cats.children].forEach(x => x.setAttribute("aria-pressed", x.dataset.c === filter));
  run();
};

function run(){
  const raw = norm($q.value), tk = toks($q.value);
  let list;
  if (!raw){
    list = DATA.entries.map(e => ({e, s: 0, why: null}))
                       .sort((a,b) => a.e.term.localeCompare(b.e.term));
  } else {
    list = [];
    for (const e of DATA.entries){
      const r = score(e, raw, tk);
      if (r) list.push({e, ...r});
    }
    list.sort((a,b) => b.s - a.s || a.e.term.localeCompare(b.e.term));
  }
  if (filter) list = list.filter(x => x.e.category === filter);
  if (tagf)   list = list.filter(x => (x.e.tags||[]).includes(tagf));
  rows = list; sel = -1;

  $n.textContent = !raw
    ? `${list.length} concept${list.length===1?"":"s"}${tagf?` tagged ${tagf}`:""}${filter?` in ${filter}`:""} · A–Z`
    : `${list.length} match${list.length===1?"":"es"}`;

  $out.innerHTML = list.length ? list.map(({e, why}, i) => `
    <li aria-selected="false" data-i="${i}">
      <div class="t"><a href="${BLOB + esc(e.path)}">${raw?hl(e.term,tk):esc(e.term)}</a>
        <span class="badge">${esc(e.category)} · ${esc(e.version)}</span></div>
      <p class="tags">${(e.tags||[]).map(t=>`<span class="tg${t===tagf?" on":""}">${esc(t)}</span>`).join("")}</p>
      <p class="e">${raw?hl(e.essence,tk):esc(e.essence)}</p>
      ${why ? `<p class="why">matched on <b>${esc(why)}</b></p>` : ""}
    </li>`).join("")
    : `<div class="empty">Nothing for “${esc($q.value)}”.<br>
       This wiki has ${DATA.count} concepts — try a broader word, or browse a category above.</div>`;
}

function move(d){
  if (!rows.length) return;
  const li = [...$out.children].filter(x => x.tagName === "LI");
  if (sel > -1) li[sel]?.setAttribute("aria-selected","false");
  sel = (sel + d + li.length) % li.length;
  li[sel].setAttribute("aria-selected","true");
  li[sel].scrollIntoView({block:"nearest"});
}
$q.addEventListener("input", run);
document.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown"){ ev.preventDefault(); move(1); }
  else if (ev.key === "ArrowUp"){ ev.preventDefault(); move(-1); }
  else if (ev.key === "Enter" && sel > -1){ $out.querySelectorAll("li")[sel].querySelector("a").click(); }
  else if (ev.key === "/" && document.activeElement !== $q){ ev.preventDefault(); $q.focus(); }
  else if (ev.key === "Escape"){ $q.value = ""; filter = tagf = null;
    [...document.querySelectorAll(".cat")].forEach(x => x.setAttribute("aria-pressed","false"));
    run(); $q.focus(); }
});
run();
</script>
